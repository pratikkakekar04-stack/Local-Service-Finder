{% extends 'base.html' %}{% block title %}Register{% endblock %}{% block content %}<section class="auth-section"><form class="auth-card" method="POST"><h1>Create Account</h1><p class="auth-description">Join as a customer or service provider.</p><label>Full Name</label><input name="name" required><label>Email</label><input type="email" name="email" required><label>Phone</label><input name="phone"><label>Password</label><input type="password" name="password" required><label>Role</label><select name="role" id="role" onchange="toggleProviderFields()"><option value="customer">Customer</option><option value="provider">Service Provider</option></select><div id="providerFields" class="provider-fields"><label>Service Category</label><select name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select><label>Experience (years)</label><input type="number" min="0" name="experience_years"><label>Address / Area</label><input name="address"><label>Description</label><textarea name="description"></textarea></div><button class="auth-button">Register</button><p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Login</a></p></form></section>{% endblock %}
